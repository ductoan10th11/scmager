services:
  mongodb:
    image: mongo:8.0.12
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?required}
    ports: ["9006:27017"]
    volumes: ["mongodb_data:/data/db"]

  mongo-init:
    image: mongo:8.0.12
    restart: "no"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?required}
    depends_on: [mongodb]
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mongosh --host mongodb:27017 -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1; do sleep 2; done
        mongosh --host mongodb:27017 -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]}) }'

  valkey:
    image: valkey/valkey:7.2.9
    restart: unless-stopped
    ports: ["9009:6379"]
    volumes: ["valkey_data:/data"]

  api:
    build: { context: ., dockerfile: Dockerfile }
    image: ework-api:${IMAGE_TAG:?set an immutable image tag or digest}
    restart: unless-stopped
    ports: ["9010:8004"]
    env_file: .env
    environment: &runtime-environment
      NODE_ENV: production
      APP_ROLE: api
      MONGO_URI: ${MONGO_URI:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      SECRET_PROVIDER: env
      GOVERNANCE_GATE_APPROVED: "false"
    command: ["node", "apps/api/dist/server.js"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8004/api/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      valkey:
        condition: service_started

  worker:
    image: ework-api:${IMAGE_TAG:?set an immutable image tag or digest}
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *runtime-environment
      APP_ROLE: worker
    command: ["node", "apps/api/dist/worker.js"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      valkey:
        condition: service_started

  web:
    build: { context: ., dockerfile: Dockerfile }
    image: ework-web:${IMAGE_TAG:?set an immutable image tag or digest}
    restart: unless-stopped
    ports: ["9011:8005"]
    command: ["pnpm", "--filter", "web", "start"]

volumes:
  mongodb_data:
  valkey_data:
